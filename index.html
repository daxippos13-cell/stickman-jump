<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman City Runner 3D</title>
  <script type="module" crossorigin src="./assets/index-BCXUqyRI.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-zWzcw92Q.css">
</head>
<body>
    <div id="ui-layer">
        <div id="score-container">
            <div id="high-score-container">
                <span class="label">HI</span>
                <span id="high-score-display">00000</span>
            </div>
            <div id="current-score-container">
                <span id="score-display">00000</span>
            </div>
        </div>
        
        <div id="main-menu">
            <h1>STICKMAN<br>CITY RUNNER</h1>
            <p>Jump over buildings. Slide under barriers.</p>
            <button id="start-btn">RUN NOW</button>
            <div class="controls-hint">
                <span>[SPACE] / [UP] Jump</span>
                <span>[DOWN] Slide</span>
            </div>
        </div>

        <div id="game-over" class="hidden">
            <h1>WIPEOUT!</h1>
            <p>Distance Run: <span id="final-score">0</span>m</p>
            <button id="restart-btn">RUN AGAIN</button>
        </div>
        
        <div id="mobile-controls">
            <button class="touch-btn" id="btn-duck">SLIDE</button>
            <button class="touch-btn" id="btn-jump">JUMP</button>
        </div>
    </div>
    
</body>
</html>
